.swatches{display:flex;gap:8px;flex-wrap:wrap;padding:4px 10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative;overflow:hidden}
.sw span{position:absolute;inset:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.palcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.palcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px}
.palcard[aria-pressed="true"]{border:2px solid var(--ink)}
.palcard .strip{display:flex;height:28px;border-radius:8px;overflow:hidden}
.palcard .strip i{flex:1}
.palcard b{font-size:13.5px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
.shell{display:flex;min-height:100%}
.side{width:268px;flex-shrink:0;border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}
.ring{width:100%;max-width:220px;align-self:center;display:block}
.ring .node{cursor:pointer}
.ring .node:focus{outline:none}
.ring .node:focus-visible circle.dot{stroke:var(--accent);stroke-width:3}
.stages{display:flex;flex-direction:column;gap:2px}
.grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.grp.blue{color:var(--accent-text)}
.stg{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;color:var(--ink);font-weight:500}
.stg:hover{background:var(--sunk)}
.stg[aria-current="page"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.stg .ltr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line);flex-shrink:0}
.stg[aria-current="page"] .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stg .sub{font-size:12px;color:var(--muted);font-weight:500;display:block}
.stg .dotnext{margin-left:auto;font-size:11px;font-weight:700;color:var(--sun);white-space:nowrap}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.side-foot button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:8px;color:var(--muted)}
.side-foot button:hover{background:var(--sunk);color:var(--ink)}
main{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 120px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage-head h1{font-size:clamp(26px,3.2vw,34px);font-weight:700;letter-spacing:-.01em;margin-top:2px}
.stage-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card-h{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h span,.card>h2 span{letter-spacing:0;text-transform:none;font-weight:500}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}
.g-plan{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 20px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent-text);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows>.row:first-child{border-top:0;padding-top:2px}
.row .l{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:12.5px}
.row .r{text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.sun{background:var(--sun-soft);color:var(--ink)}
.pill.blue{background:var(--accent-soft);color:var(--accent-text)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun-soft);border-radius:12px;padding:12px 16px;font-size:14px}
.banner.blue{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft)}
.hero{background:var(--accent);color:var(--accent-ink);border:0;border-radius:20px;padding:24px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:none}
.hero.over{background:var(--warn)}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(54px,8vw,84px);line-height:.95;letter-spacing:-.03em}
.hero .sub{font-size:16px;opacity:.95}
.hero .facts{display:flex;gap:10px;flex-wrap:wrap}
.hero .fact{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;font-size:12.5px}
.hero .fact b{display:block;font-size:15px}
:root[data-theme="dark"] .hero .fact{background:rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .fact{background:rgba(0,0,0,.18)}}
.hero .link{color:inherit}
.flowbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--track)}
.flowbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:8px}
.bar.over i{background:var(--warn)}
.bar.blue i{background:var(--accent)}
.bar.sun i{background:var(--sun)}
.env{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.env:first-of-type{border-top:0;padding-top:0}
.env .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;font-size:15px;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:90px}
.amount-in{font-family:var(--display)!important;font-weight:700!important;font-size:34px!important;padding:6px 12px!important}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.chip small{font-weight:500;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip.dashed{border-style:dashed}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.period-nav{display:flex;align-items:center;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px;line-height:1}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.table input[type=text],.table select,.table input[type=date],.table input[type=number]{padding:6px 8px;font-size:14px;border-radius:8px}
.tbl-wrap{overflow-x:auto}
.xbtn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600}
.xbtn:hover{border-color:var(--line);color:var(--warn)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper input{width:84px!important;text-align:right;padding:5px 8px!important;font-size:14px!important}

/* ---- v2 intentions & mindful ---- */

.lnum.done{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.lnum.need{background:var(--sun-soft);border-color:transparent;color:var(--warn)}
.litem.on .lnum{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.ltxt{display:flex;flex-direction:column;min-width:0;flex:1}.ltxt b{font-size:15.5px;font-weight:700;line-height:1.2}.ltxt small{font-size:12.5px;color:var(--muted)}
.litem.on .ltxt small{color:inherit;opacity:.72}
.lnext{margin-left:auto;align-self:flex-start;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
.lsub{display:flex;flex-direction:column;padding:0 12px 12px 54px;gap:2px}
.lsub button{border:0;background:transparent;color:inherit;text-align:left;padding:5px 0;font-size:13.5px;opacity:.82;display:flex;align-items:center;gap:8px}

.lsub button[aria-current="true"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:-14px}
.lnote{margin:14px 6px 0;padding:11px 13px;border-radius:12px;border:1px dashed var(--line);display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--accent-text);line-height:1.4}
.lnote svg{flex-shrink:0;margin-top:1px}
.app2 main{padding:36px clamp(16px,3vw,44px) 120px}
.wrap{max-width:1240px}
.withrail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{position:sticky;top:93px;display:flex;flex-direction:column;gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}

.rsub{font-size:14px;opacity:.8}

.rline{height:1px;background:currentColor;opacity:.15;margin:4px 0}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}.rgrid span{display:block;opacity:.7}.rgrid b{font-size:18px}

.rr span:has(small){flex-direction:column;align-items:flex-start;gap:0}
.rr.tot{font-weight:700}.rr.good b{color:var(--s-goal)}
.rcard .dot,.rail .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:2px}
.rbar{display:flex;height:9px;border-radius:9px;overflow:hidden;background:var(--track);margin:2px 0 4px}.rbar i{display:block;height:100%}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:13.5px}
.mcal span{height:32px;display:grid;place-items:center;border-radius:999px}.mcal .dw{font-size:11.5px;font-weight:700;color:var(--muted);height:22px}
.mcal .pd{background:var(--s-goal);color:var(--ink);font-weight:800}
.rpart{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:7px 0;font-weight:600;color:var(--ink)}
.rpart .rck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}
.rpart.on .rck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* log a spend inside the dark rail card */
.rcard.dark form{gap:12px!important}
.rcard.dark .card-h{color:inherit;opacity:1;font-size:17px;text-transform:none;letter-spacing:0;font-family:var(--display)}

.rcard.dark input{background:rgba(127,127,127,.16)!important;border-color:transparent!important;color:inherit!important}

.rcard.dark .worth button,.rcard.dark .wbtn{background:transparent;color:inherit;border-color:rgba(127,127,127,.4)}

.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* Track */
.trk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.hero2 .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero2 .big{font-family:var(--display);font-weight:800;font-size:clamp(52px,7vw,84px);line-height:.95;letter-spacing:-.035em}

.hero2 .link{color:var(--accent-text)}
.wkbars{display:flex;gap:16px;align-items:flex-end;margin:8px 0 2px;flex-wrap:wrap}
.wkb{display:flex;flex-direction:column;align-items:center;gap:6px;width:48px}
.wkb .wa{font-size:12px;font-weight:700}
.wkb .wbar{width:40px;height:96px;border-radius:12px;background:var(--sunk);position:relative;overflow:hidden}
.wkb .wbar i{position:absolute;left:0;right:0;bottom:0;background:var(--s-goal);border-radius:12px}
.wkb.over .wbar i{background:var(--warn)}

.facts2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.facts2>div{background:var(--sunk);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts2 span{font-size:12.5px;color:var(--muted)}.facts2 b{font-family:var(--display);font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feltrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

i.w-good{background:var(--w-good)}i.w-meh{background:var(--w-meh)}i.w-bad{background:var(--w-bad)}

.envcard.over .v .num{color:var(--warn)}
.envcard .bar i{background:var(--ink)}
.actgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.card-h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}.card-h2 h3{font-size:20px}.card-h2 span{font-size:13.5px;color:var(--muted)}
.row.nextup{background:var(--sun-soft);border-radius:12px;padding-left:8px;padding-right:8px}
.tb-tools [data-act="tour-replay"]::before{content:none!important}.tb-tools [data-act="tour-replay"]{font-size:16px!important}
.rsent.long{font-size:21px}
.withrail .goalgrid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.withrail .goal.wide{grid-column:auto}

/* pay setup, sentence style */
.seg2{display:inline-flex;align-self:flex-start;padding:4px;border-radius:999px;background:var(--sunk);gap:4px}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

/* intention choices, list style */

.ichoice .itt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ichoice .itt b{font-size:20px;font-weight:700;letter-spacing:-.01em}

.row-end .link.back{font-weight:700;color:var(--accent-text);text-decoration:none;font-size:15px}
@media (max-width:560px){.ichoice{padding:16px;gap:14px}.ichoice .ii{width:42px;height:42px}.ichoice .itt b{font-size:17px}.ichoice .its{font-size:13.5px}}

  .lnav::-webkit-scrollbar{display:none}

  .litem{flex:0 0 auto}.lstep{padding:6px 12px 6px 6px;gap:8px}.lnum{width:26px;height:26px;font-size:12px}.ltxt b{font-size:14px;white-space:nowrap}

/* ===== colour hierarchy: deep frame (header) · soft tints (selection, rail) · accent only for actions ===== */
:root{--head:#5A2A1A;--head-ink:#FFFFFF}
:root[data-palette="teal"]{--head:#163F3E}
:root[data-palette="sage"]{--head:#2C3A28}
:root[data-palette="aubergine"]{--head:#331A30}
:root[data-palette="cobalt"]{--head:#17224F}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--head:#3A1E14}
 :root[data-palette="teal"]:not([data-theme="light"]){--head:#11302F}
 :root[data-palette="sage"]:not([data-theme="light"]){--head:#1F2A1C}
 :root[data-palette="aubergine"]:not([data-theme="light"]){--head:#2C1629}
 :root[data-palette="cobalt"]:not([data-theme="light"]){--head:#141D45}}
:root[data-theme="dark"]{--head:#3A1E14}
:root[data-palette="teal"][data-theme="dark"]{--head:#11302F}
:root[data-palette="sage"][data-theme="dark"]{--head:#1F2A1C}
:root[data-palette="aubergine"][data-theme="dark"]{--head:#2C1629}
:root[data-palette="cobalt"][data-theme="dark"]{--head:#141D45}
.topbar{background:var(--head)!important;color:var(--head-ink);border-bottom:none!important}
.topbar .brand b{color:var(--head-ink)}
.topbar .brand span{color:var(--head-ink);opacity:.72}
.topbar .tb-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--head-ink)}
.topbar .tb-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45)}
.topbar .tb-btn:focus-visible{outline:2px solid var(--head-ink);outline-offset:2px}
.topbar .sw{border-color:rgba(255,255,255,.4)}
.topbar .sw[aria-pressed="true"]{border-color:var(--head-ink);box-shadow:0 0 0 2px var(--head),0 0 0 4px var(--head-ink)}
/* sidebar: selected step is a soft tint with a marker, not a solid block */
.litem.on{background:var(--accent-soft);color:var(--ink);position:relative}
.litem.on::before{content:"";position:absolute;left:-18px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.litem.on .lnum{background:var(--accent);color:var(--accent-ink)}
.litem.on .ltxt small{color:var(--muted);opacity:1}
.litem.on .lsub button{color:var(--ink)}
.litem.on .lsub button[aria-current="true"]{color:var(--accent-text)}
@media (max-width:860px){.litem.on::before{display:none}}
/* rail feature card: soft tint; its button carries the accent */
.rcard.dark{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.rcard.dark input{background:var(--surface)!important;border-color:transparent!important}
.rcard.dark .chip{background:var(--surface);border-color:transparent}
.rcard.dark .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rcard.dark .tiny,.rcard.dark .muted{color:var(--muted)!important;opacity:1}
.rcard.dark .card-h span{color:var(--muted);opacity:1}
.rcard.dark .btn.dark,.rcard.dark .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rcard.dark .worth button,.rcard.dark .wbtn{background:var(--surface);border-color:transparent}

.handbar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--sunk);border-radius:14px;padding:10px 14px;font-size:14px}
.handbtns{display:flex;gap:8px;flex-wrap:wrap}
.ytdnote{margin:-8px 2px 0}
.handcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hc-top h3{font-family:var(--display);font-size:19px;margin:0}.hc-top p{margin:2px 0 0}

.handcard .pf input,.handcard .pf select{height:40px;border-radius:10px;padding:0 10px;font-size:15px;border:1px solid var(--line);background:var(--bg)}

.hbill{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 80px;gap:8px}

.hone{display:grid;grid-template-columns:150px minmax(0,1.6fr) 120px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:900px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hone{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hone label:nth-child(2){grid-column:1/-1}}
@media (max-width:520px){.hbill{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hbill input:first-child{grid-column:1/-1}}
.greet{font-family:var(--display);font-size:clamp(17px,1.8vw,20px);font-weight:600;color:var(--muted);margin-top:8px}
.greet+h1{margin-top:0!important}

.lhello{display:flex;flex-direction:column;gap:2px;padding:0 12px 18px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.lhello b{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.lhello span{font-size:13px;color:var(--muted)}
.lhello .link{align-self:flex-start;margin-top:4px}
.lhello+.lgrp{padding-top:10px!important}
@media (min-width:861px){.trk-head .greet{display:none}}
@media (max-width:860px){.lhello{display:none}}

/* inline log a spend in the Track hero */
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:28px;align-items:start}
.hero-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-log{background:var(--sunk);border-radius:20px;padding:18px}
.hero-log .card-h{font-size:12px}
.hero-log .amount-in{font-size:28px!important;background:var(--surface)}
.hero-log input[type=text],.hero-log input[type=date]{background:var(--surface)}
.hero-log .chip{background:var(--surface)}
.hero-log .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero-log .worth button{background:var(--surface);padding:5px 4px;flex-direction:row;justify-content:center;gap:6px}.hero-log .worth button .e{font-size:18px}.hero-log .whint{font-size:15px;margin-top:2px}.hero-log form{gap:10px!important}
.hero-log .btn.dark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:861px){.trk-log{display:none}}
@media (max-width:1100px){.hero-top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.hero-log{display:none}}
.setcur{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.cursym{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}.cursym b{display:grid;place-items:center;min-width:44px;height:42px;padding:0 10px;border-radius:10px;background:var(--sunk);color:var(--ink);font-size:20px;font-family:var(--display)}

/* keep last month's intention */
.keepcard{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;background:var(--accent-soft);border-radius:20px;padding:20px 24px}
.keepsay{font-family:var(--display);font-size:clamp(20px,2.4vw,26px);font-weight:700;margin:0;line-height:1.25}
.keephow{margin:8px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.keepbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:640px){.keepbtns{align-items:stretch;width:100%}}

/* demo */
.demobar{display:flex;justify-content:center;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:9px 16px;background:var(--sun-soft);color:var(--ink);font-size:14px;text-align:center}
.demobar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.upsell{align-items:center;text-align:center;max-width:460px}.upsell h2{font-size:22px}.upsell p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}.upsell .btn{width:100%}.up-ico{font-size:34px}

    if (/deposit|credit|paid in|money in|payments? in|dépôt|habenbetrag|abono/.test(s)) return 'credit';

/* what did this day cost last year? (only Loop can do this: it has your statements) */
function holHistory(d) {
  if (!S.lbTx || !S.lbTx.length) return null;
  const ly = new Date(d.getFullYear() - 1, d.getMonth(), d.getDate());
  const txs = S.lbTx.map(t => ({ t, d: pd(t.d) })).sort((a, b) => a.d - b.d);
  if (!txs.length || txs[0].d > add(ly, -10) || txs[txs.length - 1].d < add(ly, 1)) return null;
  const CAT = ['gifts', 'shopping', 'eating', 'fun'];
  const flex = txs.filter(x => x.t.amt < 0 && CAT.includes(catOf(x.t)));
  const span = Math.max(30, diff(txs[txs.length - 1].d, txs[0].d));

}

  else if (act === 'mr-acct') { UI.mrAcct = t.value; render(); }
  else if (act === 'tx-cat') { if (!t.value) return; if (placeCount(t.dataset.k) > 1 && t.dataset.tk) { UI.catAsk = { k: t.dataset.k, tk: t.dataset.tk, c: t.value }; UI.newCat = null; return render(); } setCat(t.dataset.k, null, t.value); }
  else if (act === 'recat') { if (!t.value) return; S.rules[t.dataset.k] = t.value; S.lookback = analyze(S.lbTx); UI.recSel = UI.envSel = null; commit(); toast('Got it. Recalculated.', undoLast); }
  else if (act === 'map') { const k = t.dataset.k; UI.imp.map[k] = (k === 'sign' || k === 'order') ? t.value : +t.value; render(); }
  else if (act === 'map-mode') { const m = UI.imp.map; if (t.value === 'two') { m.amount = -1; if (m.debit < 0) m.debit = Math.min(2, m.ncol - 1); if (m.credit < 0) m.credit = Math.min(3, m.ncol - 1); } else { m.amount = m.debit >= 0 ? m.debit : Math.min(2, m.ncol - 1); m.debit = m.credit = -1; } render(); }
  else if (act === 'pdf-on') { UI.imp.pdfRev.rows[+t.dataset.i].on = t.checked; render(); }
  else if (act === 'mr-on') { UI.mr.missed[+t.dataset.i].on = t.checked; render(); }
  else if (act === 'mr-env') { UI.mr.missed[+t.dataset.i].env = t.value; }
  else if (act === 'mr-in') { UI.mr.ins[+t.dataset.i].on = t.checked; render(); }
  else if (act === 'hand-month') { UI.handM = t.value; render(); }
  else if (act === 'lo') { UI.lo = t.value; }
  else if (act === 'lo-goal') { UI.loGoal = t.value; UI.lo = 'goal'; render(); }
  else if (act === 'gm') { UI.gm = UI.gm || {}; UI.gm[t.dataset.id] = t.checked; }
});
document.addEventListener('submit', e => {
  const form = e.target; e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'hand-rough' || kind === 'hand-one') return handSubmit(kind, form);
  if (kind === 'log') {
    stashLD(form); const amt = r2(num(UI.ld.amount));
    if (!(amt > 0)) { toast('Type an amount first.'); const a = form.querySelector('[name="amount"]'); if (a) a.focus(); return; }
    const l = { id: uid(), type: UI.ld.type, amount: amt, env: UI.ld.type === 'out' ? UI.ld.env : null, note: UI.ld.note.trim(), date: UI.ld.date || ds(today()), src: 'manual' };
    if (l.type === 'out' && UI.ld.w) l.w = UI.ld.w; if (l.date === ds(today())) l.t = new Date().getHours();
    const env = S.envelopes.find(x => x.id === l.env);
    UI.ld = { type: 'out', env: null, amount: '', note: '', date: null, w: null }; UI.sheet = false;
    withUndo(`${l.type === 'in' ? 'Added' : 'Logged'} ${money(l.amount)}${env ? ' from ' + env.name : ''}`, () => S.logs.push(l));
  } else if (kind === 'newcat') {
    const name = String(new FormData(form).get('name') || '').trim(); if (!name) return;
    S.customCats = S.customCats || [];
    let c = S.customCats.find(x => x.name.toLowerCase() === name.toLowerCase()) || Object.entries(CATS).map(([id, n]) => ({ id, name: n })).find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!c) { c = { id: 'u_' + uid(), name, color: EXTRA_COLORS[S.customCats.length % EXTRA_COLORS.length] }; S.customCats.push(c); }
    syncCats(); const k = UI.newCat && UI.newCat.k, tk = UI.newCat && UI.newCat.tk; UI.newCat = null;
    if (k && tk && placeCount(k) > 1) { UI.catAsk = { k, tk, c: c.id }; commit(); return toast(`Added ${c.name}. Now choose: just this one, or everything from ${titleCase(k)}?`); }
    if (k) { S.rules[k] = c.id; }
    S.lookback = S.lbTx.length ? analyze(S.lbTx) : null; UI.recSel = UI.envSel = null; commit();
    toast(k ? `Added ${c.name}. Everything from ${titleCase(k)} is in it now.` : `Added ${c.name}. Pick it for any transaction.`, undoLast);
  } else if (kind === 'dayadd') {
    const fd = new FormData(form), name = String(fd.get('name') || '').trim(), amount = r2(num(fd.get('amount'))), rule = String(fd.get('rule') || 'once'), date = form.dataset.date, d = pd(date);
    if (!name || !(amount > 0)) { toast('Add a name and an amount.'); return; }
    const isSp = (UI.dayKind || 'special') === 'special';
    withUndo(`Added ${name}`, () => {
      if (isSp) S.specials.push({ id: uid(), name, amount, rule, date, month: d.getMonth() + 1, day: d.getDate() });
      else S.bills.push({ id: uid(), name, amount, rule, date, day: d.getDate(), month: d.getMonth() + 1 });
    });
  } else if (kind === 'oneoff') {
    const fd = new FormData(form), name = String(fd.get('name') || '').trim(), amount = r2(num(fd.get('amount'))), date = String(fd.get('date') || '');
    if (!name || !(amount > 0) || !date) { toast('Add a name, an amount and a date.'); return; }
    withUndo(`Added ${name}`, () => S.bills.push({ id: uid(), name, amount, rule: 'once', date, day: pd(date).getDate() }));
  } else if (kind === 'acct') {
    const fd = new FormData(form), name = String(fd.get('name') || '').trim();
    if (!name) { toast('Give the account a name.'); return; }
    const id = uid(); S.accounts.push({ id, name, type: String(fd.get('type') || 'chequing') }); UI.acctForm = false; UI.justAdded = id; commit();
  } else if (kind === 'checkin') {
    const v = num(new FormData(form).get('bal'));
    UI.ci = { balance: r2(v) }; render();
  }
});

document.addEventListener('toggle', e => { const k = e.target && e.target.dataset && e.target.dataset.keep; if (k) { UI.open = UI.open || {}; UI.open[k] = e.target.open; } }, true);
/* ---------- drag & drop ---------- */
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('.drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('.drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); readFiles(e.dataTransfer.files).then(f => handleFiles(f, d.dataset.drop, d.dataset.acct)); });

/* ---------- start ---------- */
(function init() {
  S = load(); SYNC.localEmpty = !S;
  if (!S) { S = blank(); UI.view = 'welcome'; }
  else UI.view = S.example ? 'spend' : suggestedStage();
  histReset();
  syncInit();
  render();
  let day = ds(today());
  setInterval(() => { if (ds(today()) !== day) { day = ds(today()); if (!UI.sheet && !UI.imp) render(); } }, 60000);
})();

/* live search in Look back: re-render as you type, keep the cursor in the box */
let _qT;
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || t.dataset.act !== 'lb-q') return;
  UI.lbQ = t.value; UI.qAll = false; clearTimeout(_qT);
  _qT = setTimeout(() => { const pos = t.selectionStart; render(); const f = document.querySelector('[data-act="lb-q"]'); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (_) {} } }, 180);
});
</script>
